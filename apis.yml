aid: avicenna-biosciences
name: Avicenna Biosciences
description: 'Avicenna Biosciences, Inc. is a Durham, North Carolina drug development
  company using machine learning-enhanced medicinal chemistry to accelerate the lead-to-candidate
  optimization process for small molecule drug development. Founded in 2020 and led
  by president and CEO Chris Meldrum, the company applies computational screening of
  candidate molecules for drug-like properties to the "last mile" of small molecule
  discovery, targeting neurodegenerative disease programs including Rho kinase inhibitors
  for Parkinson''s disease and ALS. Avicenna raised a seed round led by DCVC Bio and
  has signed research collaborations with partners such as Molecure S.A. The company
  publishes no public developer portal, API, or machine-readable interface as of this
  enrichment pass; it is catalogued here as an AI-for-drug-discovery company profile
  rather than an API provider.'
